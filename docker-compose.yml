# Chatbot cong khai: db rieng (pgvector) + api. Khong dung chung DB voi crawler.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qnebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: qnebot
    ports:
      - "5434:5432"          # crawler dung 5433, tranh dung cong
    volumes:
      - qnebot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qnebot -d qnebot"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8100:8100"          # crawler dung 8000
    env_file: .env
    volumes:
      - .:/code              # mount ca repo: scripts/ va tests/ chay duoc trong container
    extra_hosts:
      - "host.docker.internal:host-gateway"   # goi crawler dang chay tren may host
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload

volumes:
  qnebot_pgdata:
