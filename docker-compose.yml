services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: qne
      POSTGRES_PASSWORD: qne
      POSTGRES_DB: qne_chatbot
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qne -d qne_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      args:
        INSTALL_EMBED: "0"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://qne:qne@db:5432/qne_chatbot
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./data:/app/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

volumes:
  pgdata:
